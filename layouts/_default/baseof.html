<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    {{ if .Params.charts }}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {{ end }}
</head>
<body>
    <div class="container{{ if eq .Section "blog" }} blog-container{{ end }}">
        <aside class="left-sidebar">
            <div class="profile-section">
                <a href="/">
                    <img src="/img/niki.jpeg" alt="Nikita Goldovsky" class="profile-pic">
                </a>
                <h1 class="name"><a href="/" style="color: inherit; text-decoration: none;">Nikita Goldovsky</a></h1>
                <p class="tagline">{{ .Site.Params.tagline }}</p>
            </div>
        </aside>

        <main class="main-content">
            {{ block "main" . }}{{ end }}
        </main>

        <aside class="sidebar">
            <nav class="sidebar-links">
                <a href="/blog/">Blog</a>
                <a href="https://github.com/dumplingcompromise" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/nikita-goldovsky-093b149" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://nikitagoldovsky.medium.com/" target="_blank" rel="noopener noreferrer">Medium</a>
            </nav>
        </aside>
    </div>
    {{ if .Params.charts }}
    <script src="/js/charts.js"></script>
    {{ end }}
    {{ block "scripts" . }}{{ end }}
</body>
</html>
